# e1 GPU chain 12/12: S1-12b: the windnoise-trained v3 on the 60 windnoise test seeds, 200 paths, DDIM 50, 10-seed chunks; then merge + mark diff (summary, all three parts done)
# Legacy equivalent: queue job s1c_wn_b_eval.cmd. Body: D:/LastEmbers/e1/condor/e1-s1c-wn-b-eval.cmd (same file in this directory):
# Own cwd (holds the wrapper's STOP file); the body does cd ml\forecast, mkdir outputs, verify (SHA256SUMS), run.
# Segments: the script exits 85 at its 10200 s budget or on the STOP file; HTCondor restarts it in place and it
# resumes from the parts / .state on disk.
name        = "e1-s1c-wn-b-eval"
project     = "paper"
lane        = "win-gpu"
cpus        = 2
memory_gb   = 10
gpus        = 1
expected_hours = 4
segment_hours  = 3

[run]
cwd  = "D:/compute/runs/e1-s1c-wn-b-eval"
cmd  = "C:/Windows/System32/cmd.exe"
args = ["/c", "D:\\LastEmbers\\e1\\condor\\e1-s1c-wn-b-eval.cmd"]
env  = { PYTHONUTF8 = "1", PYTHONPATH = "D:\\LastEmbers\\e1\\ml\\forecast", E1_FC = "D:\\LastEmbers\\e1\\ml\\forecast", DEVICE = "cuda", TORCH_THREADS = "2" }

[after]
jobs = ["e1-s1c-wn-a-train"]

[notify]
session = "paper-e1"
