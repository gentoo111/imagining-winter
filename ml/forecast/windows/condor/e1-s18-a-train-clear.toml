# e1 GPU chain 5/12: S1-8: v3 cfgC lr 1e-3 seed 1 on endurance/clear, 100000 steps (train_chain.py segments) -> out\secondary\diff3_endurance_clear_s1.pt
# Legacy equivalent: queue job s18_a_train_clear.cmd. Body: D:/LastEmbers/e1/condor/e1-s18-a-train-clear.cmd (same file in this directory):
# Own cwd (holds the wrapper's STOP file); the body does cd ml\forecast, mkdir outputs, verify (SHA256SUMS), run.
# Segments: the script exits 85 at its 10200 s budget or on the STOP file; HTCondor restarts it in place and it
# resumes from the parts / .state on disk.
name        = "e1-s18-a-train-clear"
project     = "paper"
lane        = "win-gpu"
cpus        = 2
memory_gb   = 10
gpus        = 1
expected_hours = 6
segment_hours  = 3

[run]
cwd  = "D:/compute/runs/e1-s18-a-train-clear"
cmd  = "C:/Windows/System32/cmd.exe"
args = ["/c", "D:\\LastEmbers\\e1\\condor\\e1-s18-a-train-clear.cmd"]
env  = { PYTHONUTF8 = "1", DEVICE = "cuda", SEED = "1", V3_CFG = "C", LR = "1e-3", TF32 = "1", VAL_EVERY = "1000", PYTHONPATH = "D:\\LastEmbers\\e1\\ml\\forecast", CHAIN_TRAIN_PY = "D:\\LastEmbers\\e1\\ml\\forecast\\windows\\secondary\\train.py", CHAIN_ENV = "V3_CFG,LR,TF32,SEED,CHAIN_ENV" }

[after]
jobs = ["e1-s16-e200-9-done"]

[notify]
session = "paper-e1"
