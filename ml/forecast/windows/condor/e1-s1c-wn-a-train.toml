# e1 GPU chain 11/12: S1-12b: diffusion retrained on the windnoise training set (selected-v3 recipe, 100000 steps); --then queue_eval writes nothing under Condor (e1-s1c-wn-b-eval follows via [after])
# Legacy equivalent: queue job s1c_wn_a_train.cmd. Body: D:/LastEmbers/e1/condor/e1-s1c-wn-a-train.cmd (same file in this directory):
# Own cwd (holds the wrapper's STOP file); the body does cd ml\forecast, mkdir outputs, verify (SHA256SUMS), run.
# Segments: the script exits 85 at its 10200 s budget or on the STOP file; HTCondor restarts it in place and it
