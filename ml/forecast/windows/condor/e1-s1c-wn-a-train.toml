name        = "e1-s1c-wn-a-train"
project     = "paper"
lane        = "win-gpu"
cpus        = 2
memory_gb   = 10
gpus        = 1
expected_hours = 6
segment_hours  = 3

[run]
cwd  = "D:/compute/runs/e1-s1c-wn-a-train"
cmd  = "C:/Windows/System32/cmd.exe"
args = ["/c", "D:\\LastEmbers\\e1\\condor\\e1-s1c-wn-a-train.cmd"]
env  = { PYTHONUTF8 = "1", PYTHONPATH = "D:\\LastEmbers\\e1\\ml\\forecast", E1_FC = "D:\\LastEmbers\\e1\\ml\\forecast", DEVICE = "cuda", SEED = "1", V3_CFG = "C", LR = "1e-3", TF32 = "1", VAL_EVERY = "1000", CHAIN_TRAIN_PY = "D:\\LastEmbers\\e1\\ml\\forecast\\windows\\windnoise\\train.py", CHAIN_ENV = "V3_CFG,LR,TF32,SEED,E1_FC,PYTHONUTF8,CHAIN_ENV" }

[after]
